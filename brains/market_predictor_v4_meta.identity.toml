# --- CLIENT-COMPUTED RELATION POOLS (pass 106, Cove) ----------------------
# The association layer. Pools 1-11 above are flat sensory siblings that meet
# only at the Action pool: a flat set can carry "return = x" and "range = y",
# but never "x is large FOR y". That conjunction exists only if something
# writes it down, so these three pools carry it explicitly.
#
# They are declared SensoryInput ON PURPOSE, not Internal. PoolKind::Internal
# is inert -- it is matched 0 times in crates/brain (the only behavioural
# match on PoolKind is Action, brain.rs:7417) and its own doc comment says
# "future composite layers". Marking these Internal would buy nothing and
# would risk a silent-drop path if observe() ever routes by kind.
# See data/brain_experiments/TOPOLOGY-DESIGN-pass106-cove.md in
# CoolCryptoUtilities for the proof.
#
# Every knob is set explicitly: bare defaults truncate frames to 19% recall.

