name = "market_predictor_v2"
version = "0.1.0"
binding_emergence_threshold = 3
moment_history_window = 256
min_atom_score = 0.94

# Every view remains byte/character atom grounded.  The pools separate causal
# feature families so the binding fabric can learn which combinations matter
# without flattening OHLCV, news, horizon, and instrument identity together.
[[pools]]
name = "ohlcv_geometry"
id = 1
prototype = "byte-passthrough"
atom_encoding_prefix = "market_geometry"
kind = "SensoryInput"
frame_rate = 1
recent_atoms_window = 65536
max_concept_member_count = 24
concept_emergence_threshold = 5
decay_rate = 0.00002
prune_floor = 0.001

