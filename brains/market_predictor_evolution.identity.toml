name = "market_predictor_evolution"
version = "0.1.0"
binding_emergence_threshold = 3
moment_history_window = 512
min_atom_score = 0.94

# The evolving relationship pool is deliberately atom-grounded: genomes may
# select and combine causal numeric features, but every value still enters as
# named characters and deterministic buckets rather than opaque token IDs.
[[pools]]
name = "forecast_horizon"
id = 9
prototype = "byte-passthrough"
atom_encoding_prefix = "market_horizon"
kind = "SensoryInput"
frame_rate = 1
recent_atoms_window = 4096
max_concept_member_count = 8
concept_emergence_threshold = 5
decay_rate = 0.00002
prune_floor = 0.001

