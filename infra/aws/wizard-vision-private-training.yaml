AWSTemplateFormatVersion: "2010-09-09"
Description: Private, cost-bounded Wizard Vision corpus-training host.

Parameters:
  ArtifactBucket:
    Type: String
    Default: wizard-vision-private-321572159829-us-east-1
  InstanceType:
    Type: String
    Default: m6a.xlarge
  DataVolumeGiB:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 2048
  MaximumRuntimeHours:
    Type: Number
    Default: 192
    MinValue: 24
    MaxValue: 192

Resources:
  TrainingVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.73.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: wizard-vision-private}
        - {Key: Project, Value: WizardVision}

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TrainingVpc
      CidrBlock: 10.73.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: wizard-vision-private-a}
        - {Key: Project, Value: WizardVision}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TrainingVpc
      Tags:
        - {Key: Name, Value: wizard-vision-private}
        - {Key: Project, Value: WizardVision}

  PrivateRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No-ingress Wizard Vision training host
      VpcId: !Ref TrainingVpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - {Key: Name, Value: wizard-vision-training}
        - {Key: Project, Value: WizardVision}

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the private training host to AWS endpoints
      VpcId: !Ref TrainingVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - {Key: Name, Value: wizard-vision-endpoints}
        - {Key: Project, Value: WizardVision}

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref TrainingVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: [!Ref PrivateRouteTable]

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref TrainingVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref TrainingVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref TrainingVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnet]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]

  TrainingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wizard-vision-private-training
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WizardVisionArtifactsAndCostStop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/wizard-vision/*
  TrainingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: wizard-vision-private-training
      Roles: [!Ref TrainingRole]

  TrainingDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt PrivateSubnet.AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeGiB
      VolumeType: gp3
      Iops: 3000
      Throughput: 125
      Tags:
        - {Key: Name, Value: wizard-vision-training-data}
        - {Key: Project, Value: WizardVision}
        - {Key: CostGuard, Value: Temporary}

  TrainingInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - S3Endpoint
      - SsmEndpoint
      - SsmMessagesEndpoint
      - Ec2MessagesEndpoint
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref TrainingInstanceProfile
      InstanceInitiatedShutdownBehavior: stop
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - {Key: Name, Value: wizard-vision-private-training}
        - {Key: Project, Value: WizardVision}
        - {Key: CostGuard, Value: Temporary}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3 tar gzip xfsprogs
          cat >/usr/local/sbin/wizard-cost-stop.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          DEADLINE_FILE=/srv/wizard/control/cost-deadline.epoch
          test -r "$DEADLINE_FILE" || exit 0
          DEADLINE=$(cat "$DEADLINE_FILE")
          NOW=$(date +%s)
          if test "$NOW" -ge "$DEADLINE"; then
            /sbin/shutdown -h now
          fi
          EOF
          chmod 750 /usr/local/sbin/wizard-cost-stop.sh
          mkdir -p /srv/wizard
          DATA_DEVICE=""
          for ATTEMPT in $(seq 1 60); do
            DATA_DEVICE=$(lsblk -bndo PATH,SIZE,TYPE | awk '$3=="disk" && $2>500000000000 {print $1; exit}')
            if test -n "$DATA_DEVICE"; then break; fi
            sleep 5
          done
          test -n "$DATA_DEVICE"
          if ! blkid "$DATA_DEVICE"; then mkfs.xfs -f -m reflink=1 "$DATA_DEVICE"; fi
          DATA_UUID=$(blkid -s UUID -o value "$DATA_DEVICE")
          grep -q "$DATA_UUID" /etc/fstab || echo "UUID=$DATA_UUID /srv/wizard xfs defaults,nofail 0 2" >> /etc/fstab
          mount /srv/wizard
          mkdir -p /srv/wizard/project /srv/wizard/runtime /srv/wizard/control
          DEADLINE_FILE=/srv/wizard/control/cost-deadline.epoch
          if ! test -s "$DEADLINE_FILE"; then
            echo $(($(date +%s) + ${MaximumRuntimeHours} * 3600)) >"$DEADLINE_FILE"
          fi
          cat >/etc/systemd/system/wizard-cost-stop.service <<'EOF'
          [Unit]
          Description=Stop Wizard Vision training host after its persisted cost deadline
          After=srv-wizard.mount
          RequiresMountsFor=/srv/wizard

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/wizard-cost-stop.sh
          EOF
          cat >/etc/systemd/system/wizard-cost-stop.timer <<'EOF'
          [Unit]
          Description=Check the Wizard Vision persisted cost deadline

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Persistent=true
          Unit=wizard-cost-stop.service

          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now wizard-cost-stop.timer
          chown -R ec2-user:ec2-user /srv/wizard
          printf '{"state":"infrastructure_ready","region":"%s","bucket":"%s"}\n' '${AWS::Region}' '${ArtifactBucket}' >/srv/wizard/control/state.json

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref TrainingInstance
      VolumeId: !Ref TrainingDataVolume

Outputs:
  InstanceId:
    Value: !Ref TrainingInstance
  DataVolumeId:
    Value: !Ref TrainingDataVolume
  PrivateIp:
    Value: !GetAtt TrainingInstance.PrivateIp
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  MaximumRuntimeHours:
    Value: !Ref MaximumRuntimeHours
